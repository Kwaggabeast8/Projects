<title>Jarvis HUD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: system readouts left, reactor centre, device panels right, command strip below; stacks on phones.
   One committed look: dark cyan heads-up display, so every colour is set explicitly. */
:root{
  --bg:#02111a; --bg2:#031a26; --cy:#2ee6ff; --cy-dim:#12849a; --cy-faint:rgba(46,230,255,.14);
  --line:rgba(46,230,255,.38); --panel:rgba(5,34,47,.62); --txt:#bff6ff; --mute:#5fa6b5;
  --amber:#ffb347; --amber-bg:rgba(255,179,71,.1); --red:#ff6b6b; --green:#6ff0b0;
  --disp:'Orbitron','Arial Narrow',sans-serif; --mono:'Share Tech Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(ellipse at 50% 38%,#06344a 0,transparent 55%),
  repeating-linear-gradient(0deg,transparent 0 39px,rgba(46,230,255,.045) 39px 40px),
  repeating-linear-gradient(90deg,transparent 0 39px,rgba(46,230,255,.045) 39px 40px),
  var(--bg);
  color:var(--txt);font-family:var(--mono);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:14px 28px;min-height:100%}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px;border-bottom:1px solid var(--line);padding-bottom:8px}
h1{font-family:var(--disp);font-size:1.15rem;letter-spacing:.35em;margin:0;color:var(--cy);text-shadow:0 0 12px var(--cy)}
.link{font-size:12px;letter-spacing:.12em;color:var(--mute)}
.link b{font-weight:400;color:var(--amber)} .link.live b{color:var(--green)}
.hud{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr) minmax(0,290px);gap:16px;align-items:start}
@media (max-width:980px){.hud{grid-template-columns:minmax(0,1fr)}.center{order:-1}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);padding:12px 14px;min-width:0;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.panel::before{content:"";position:absolute;left:0;top:0;width:26px;height:2px;background:var(--cy);box-shadow:0 0 8px var(--cy)}
h2{font-family:var(--disp);font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cy);margin:0 0 10px}
.clock{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);line-height:1.1}
.ring .v b{font-size:20px;font-weight:700;color:var(--cy);text-shadow:0 0 10px var(--cy)} .ring .v small{font-size:10px;letter-spacing:.15em;color:var(--mute)}
.date{font-size:13px;color:var(--mute);letter-spacing:.08em}.date b{display:block;font-family:var(--disp);font-size:12.5px;white-space:nowrap;color:var(--txt);font-weight:500}
.meter{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.meter .row{display:flex;justify-content:space-between;font-size:13px}
.bar{height:8px;background:var(--cy-faint);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cy-dim),var(--cy));box-shadow:0 0 8px var(--cy);transition:width .6s}
.center{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.reactor{width:min(100%,460px);aspect-ratio:1;filter:drop-shadow(0 0 18px rgba(46,230,255,.35))}
.reactor svg{width:100%;height:100%;display:block}
.cw{transform-origin:200px 200px;animation:spin 60s linear infinite}
.ccw{transform-origin:200px 200px;animation:spin 38s linear infinite reverse}
.mid{transform-origin:200px 200px;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.core{transform-origin:200px 200px;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07);opacity:.82}}
[data-state="thinking"] .cw{animation-duration:8s}[data-state="thinking"] .ccw{animation-duration:6s}[data-state="thinking"] .mid{animation-duration:3s}
[data-state="listening"] .core{animation-duration:1.1s}
[data-state="speaking"] .core{animation-duration:.55s}
[data-state="alert"] .core circle{stroke:var(--amber)}[data-state="alert"] .core{filter:hue-rotate(160deg) saturate(1.4)}
.status{font-family:var(--disp);letter-spacing:.4em;font-size:13px;color:var(--cy);text-shadow:0 0 10px var(--cy);text-transform:uppercase;text-align:center}
.sub{font-size:13px;color:var(--mute);text-align:center;min-height:1.4em;max-width:56ch;overflow-wrap:anywhere}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:flex;gap:10px;font-size:14px;min-width:0}
li .t{color:var(--mute);flex:none;min-width:5.6em;font-size:13px}li .x{min-width:0;overflow-wrap:anywhere}
li.unread .x{color:var(--cy)}
.light{display:flex;align-items:center;gap:10px;font-size:14px}.light span:nth-child(2){flex:1}
.bulb{width:12px;height:12px;border:2px solid var(--mute);border-radius:50%;flex:none;transition:.3s}
.light.on .bulb{background:var(--amber);border-color:var(--amber);box-shadow:0 0 12px var(--amber)}
.pct{color:var(--mute);font-size:13px}
.flash{animation:fl 1.2s}@keyframes fl{from{background:var(--cy-faint)}to{background:transparent}}
.cmd{display:flex;flex-direction:column;gap:10px}
#log{display:flex;flex-direction:column;gap:6px;max-height:230px;min-height:110px;overflow-y:auto;font-size:14px;padding-right:6px}
.me{color:var(--mute)}.me::before{content:"> ";color:var(--cy)}
.jv{color:var(--txt)}.jv::before{content:"JARVIS  ";color:var(--cy);letter-spacing:.1em;font-size:12px}
.tool{border-left:2px solid var(--cy-dim);padding:2px 10px;font-size:13px;color:var(--mute);overflow-wrap:anywhere}.tool b{color:var(--cy);font-weight:400}
.ask{border:1px solid var(--amber);background:var(--amber-bg);padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.ask .q{color:var(--amber)}
.btns,.chips{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;color:var(--cy);background:transparent;border:1px solid var(--line);padding:5px 14px;letter-spacing:.06em}
button:hover{background:var(--cy-faint);box-shadow:0 0 10px var(--cy-faint)}
button.go{background:var(--cy);color:#022029;border-color:var(--cy)}
.ask button.go{background:var(--amber);border-color:var(--amber)}
.chips button{font-size:12.5px;padding:3px 10px;color:var(--mute)}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:var(--txt);background:rgba(2,17,26,.8);border:1px solid var(--line);padding:9px 12px}
input::placeholder{color:var(--mute)}
#mic[aria-pressed="true"]{background:var(--cy);color:#022029;box-shadow:0 0 14px var(--cy)}
.demo-only[hidden],.live-only[hidden]{display:none!important}
.note{font-size:12.5px;color:var(--mute);margin:0}
@media (prefers-reduced-motion:reduce){.cw,.ccw,.mid,.core{animation:none}.bar i,.bulb{transition:none}.flash{animation:none}}
</style>
<div class="wrap" id="root" data-state="idle">
  <div class="top"><h1>J.A.R.V.I.S.</h1><span class="link" id="link">LINK <b id="linkv">SIMULATED DEMO</b></span></div>
  <div class="hud">
    <div class="col">
      <section class="panel"><h2>Chronometer</h2>
        <div class="clock"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--cy-faint)" stroke-width="5"/><circle id="secring" cx="50" cy="50" r="44" fill="none" stroke="var(--cy)" stroke-width="5" stroke-dasharray="276.46" stroke-dashoffset="276"/></svg>
          <div class="v"><b id="tm">00:00</b><small id="ts">:00</small></div></div>
          <div class="date"><b id="dd">—</b><span id="dw"></span></div></div></section>
      <section class="panel"><h2>System</h2>
        <div class="meter"><div class="row"><span>CPU</span><span id="cpuv">--</span></div><div class="bar"><i id="cpub" style="width:0"></i></div></div>
        <div class="meter"><div class="row"><span>MEMORY</span><span id="memv">--</span></div><div class="bar"><i id="memb" style="width:0"></i></div></div>
        <div class="meter" style="margin:0"><div class="row"><span>ACTIONS TODAY</span><span id="cnt">0</span></div></div></section>
    </div>
    <div class="center">
      <div class="reactor"><svg viewBox="0 0 400 400" role="img" aria-label="Arc reactor status display">
        <defs><radialGradient id="cg"><stop offset="0" stop-color="#eaffff"/><stop offset=".35" stop-color="#2ee6ff"/><stop offset="1" stop-color="#0b6a80" stop-opacity=".2"/></radialGradient></defs>
        <g class="cw" fill="none" stroke="#2ee6ff"><circle cx="200" cy="200" r="190" stroke-width="10" stroke-dasharray="2 9.94" opacity=".55"/><circle cx="200" cy="200" r="178" stroke-width="1" opacity=".5"/></g>
        <g class="ccw" fill="none" stroke="#2ee6ff"><circle cx="200" cy="200" r="160" stroke-width="3" stroke-dasharray="120 40 30 40 200 60 80 40" opacity=".8"/><circle cx="200" cy="200" r="150" stroke-width="1" stroke-dasharray="3 6" opacity=".6"/></g>
        <g class="mid" fill="none" stroke="#2ee6ff"><circle cx="200" cy="200" r="128" stroke-width="14" stroke-dasharray="90 28" opacity=".35"/><circle class="hot" cx="200" cy="200" r="128" stroke-width="3" stroke-dasharray="40 600" stroke="#ff6b6b" opacity=".9"/></g>
        <circle cx="200" cy="200" r="104" fill="none" stroke="#2ee6ff" stroke-width="2" opacity=".9"/><circle cx="200" cy="200" r="94" fill="#02202c" stroke="#12849a" stroke-width="1"/>
        <g class="core"><circle cx="200" cy="200" r="74" fill="url(#cg)" opacity=".5"/><circle cx="200" cy="200" r="46" fill="none" stroke="#2ee6ff" stroke-width="3"/><circle cx="200" cy="200" r="26" fill="url(#cg)" stroke="#bff6ff" stroke-width="1.5"/></g>
        <g stroke="#2ee6ff" stroke-width="1.5" opacity=".8"><path d="M200 96v-18M200 304v18M96 200h-18M304 200h18"/></g>
      </svg></div>
      <div class="status" id="status">Standby</div>
      <div class="sub" id="sub">Type a command, or tap the microphone.</div>
    </div>
    <div class="col">
      <section class="panel demo-only"><h2>Smart home</h2><div id="lights" style="display:flex;flex-direction:column;gap:8px"></div></section>
      <section class="panel demo-only"><h2>Calendar</h2><ul id="cal"></ul></section>
      <section class="panel demo-only"><h2>Inbox</h2><ul id="mail"></ul></section>
      <section class="panel demo-only"><h2>Files</h2><ul id="files"></ul></section>
      <section class="panel live-only" hidden><h2>Activity</h2><ul id="acts"><li class="x" style="color:var(--mute)">Nothing yet.</li></ul></section>
    </div>
  </div>
  <section class="panel cmd">
    <h2>Command</h2>
    <div id="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form id="f"><button type="button" id="mic" aria-pressed="false" title="Voice: say 'Jarvis, ...'">MIC</button><input id="in" type="text" placeholder="Say or type a command…" autocomplete="off"><button class="go" type="submit">SEND</button></form>
  </section>
</div>
<script>
const TOKEN='__JARVIS_TOKEN__', LIVE=!TOKEN.startsWith('__');
const $=id=>document.getElementById(id), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const root=$('root'); let actions=0;
function setState(s,sub){root.dataset.state=s;$('status').textContent={idle:'Standby',listening:'Listening',thinking:'Processing',speaking:'Speaking',alert:'Awaiting approval'}[s];if(sub!==undefined)$('sub').textContent=sub}

/* ---- clock + meters ---- */
function tick(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  $('tm').textContent=p(d.getHours())+':'+p(d.getMinutes());$('ts').textContent=':'+p(d.getSeconds());
  $('secring').style.strokeDashoffset=276.46*(1-(d.getSeconds()+d.getMilliseconds()/1000)/60);
  $('dd').textContent=d.toLocaleDateString([], {day:'numeric',month:'long'}).toUpperCase();$('dw').textContent=d.toLocaleDateString([], {weekday:'long',year:'numeric'});}
setInterval(tick,250);tick();
function meter(id,v,txt){const e=$(id+'b');if(v==null){$(id+'v').textContent='n/a';e.style.width='0';return}e.style.width=Math.max(2,Math.min(100,v))+'%';$(id+'v').textContent=txt||Math.round(v)+'%'}
let cpu=22,mem=48;
async function stats(){
  if(LIVE){try{const r=await (await fetch('/api/stats',{headers:{'X-Jarvis-Token':TOKEN}})).json();meter('cpu',r.cpu);meter('mem',r.mem);return}catch(e){}}
  cpu=Math.max(5,Math.min(90,cpu+(Math.random()-.5)*14));mem=Math.max(30,Math.min(80,mem+(Math.random()-.5)*3));meter('cpu',cpu);meter('mem',mem)}
setInterval(stats,2000);stats();

/* ---- log helpers ---- */
const log=$('log');
function line(cls,text){const d=document.createElement('div');d.className=cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function toolLine(name,args,res){actions++;$('cnt').textContent=actions;const d=document.createElement('div');d.className='tool';
  d.innerHTML='<b></b> <span></span> → <span></span>';const s=d.querySelectorAll('b,span');s[0].textContent=name;s[1].textContent=args;s[2].textContent=res;log.appendChild(d);log.scrollTop=log.scrollHeight;
  if(LIVE){const u=$('acts');if(u.firstChild&&u.firstChild.classList.contains('x'))u.innerHTML='';const li=document.createElement('li');li.innerHTML='<span class="t"></span><span class="x"></span>';
    li.children[0].textContent=new Date().toTimeString().slice(0,5);li.children[1].textContent=name+' '+args;u.prepend(li);while(u.children.length>6)u.lastChild.remove()}}
let speakOn=true,mute=0;
function say(t){line('jv',t);$('sub').textContent=t;
  try{if(speakOn&&window.speechSynthesis){const u=new SpeechSynthesisUtterance(t);setState('speaking');mute=Infinity;
    u.onend=u.onerror=()=>{mute=Date.now()+600;if(root.dataset.state==='speaking')setState('idle')};speechSynthesis.speak(u);return}}catch(e){}
  setState('idle')}

/* ---- confirmations (click, or answer yes/no by voice or keyboard) ---- */
let pending=null;
function confirmCard(q,onAnswer){setState('alert',q);
  const d=document.createElement('div');d.className='ask';d.innerHTML='<div class="q"></div><div class="btns"><button class="go" type="button">YES</button><button type="button">NO</button></div>';
  d.querySelector('.q').textContent=q;log.appendChild(d);log.scrollTop=log.scrollHeight;
  const done=v=>{if(!pending)return;pending=null;d.querySelector('.btns').remove();d.querySelector('.q').textContent+=v?'  [approved]':'  [declined]';setState('thinking','Working…');onAnswer(v)};
  const [y,n]=d.querySelectorAll('button');y.onclick=()=>done(true);n.onclick=()=>done(false);pending=done;y.focus();
  try{if(speakOn&&window.speechSynthesis){mute=Infinity;const u=new SpeechSynthesisUtterance(q);u.onend=u.onerror=()=>{mute=Date.now()+600};speechSynthesis.speak(u)}}catch(e){}}
const YES=/^(yes|yeah|yep|sure|go ahead|do it|confirm|affirmative|proceed|ok|okay)\b/i,NO=/^(no|nope|cancel|don'?t|stop|negative)\b/i;

/* ---- backends ---- */
async function submit(t){t=t.trim();if(!t)return;line('me',t);$('in').value='';
  if(pending){if(YES.test(t))pending(true);else if(NO.test(t))pending(false);else say('Please answer yes or no.');return}
  setState('thinking','Processing…');
  if(LIVE){try{const r=await fetch('/api/ask',{method:'POST',headers:{'X-Jarvis-Token':TOKEN,'Content-Type':'application/json'},body:JSON.stringify({text:t})});
      if(!r.ok)say(r.status===409?'One moment, I am still busy.':'Request failed.')}catch(e){say('I lost the link to Jarvis.')}}
  else await demo(t)}
if(LIVE){(async function poll(){let last=0;for(;;){try{const r=await fetch('/api/events?after='+last,{headers:{'X-Jarvis-Token':TOKEN}});
  for(const e of (await r.json()).events){last=e.n;
    if(e.type==='tool')toolLine(e.name,e.args,e.result);
    else if(e.type==='ask')confirmCard(e.question,v=>fetch('/api/answer',{method:'POST',headers:{'X-Jarvis-Token':TOKEN,'Content-Type':'application/json'},body:JSON.stringify({id:e.id,ok:v})}));
    else if(e.type==='say')say(e.text);
    else if(e.type==='error'){line('tool','error: '+e.text);setState('idle',e.text)}}}catch(err){await sleep(2000)}}})()}

/* ---- demo backend (scripted; used when no Jarvis server is attached) ---- */
const S={lights:[{n:'Kitchen',on:false,p:100},{n:'Living room',on:true,p:60},{n:'Desk',on:false,p:100}],
 cal:[{t:'Today 14:00',x:'Team standup'},{t:'Thu 09:30',x:'Dentist'}],
 mail:[{f:'Maya',x:'Dinner on Friday?',u:true},{f:'GitHub',x:'New pull request opened',u:true},{f:'Dad',x:'Photos from the trip',u:false}],
 files:[{t:'Documents',x:'notes.txt'}]};
function render(fl){const L=$('lights');L.innerHTML='';S.lights.forEach(l=>{const d=document.createElement('div');d.className='light'+(l.on?' on':'')+(fl===l.n?' flash':'');
  d.innerHTML='<span class="bulb"></span><span></span><span class="pct"></span>';d.children[1].textContent=l.n;d.children[2].textContent=l.on?l.p+'%':'off';L.appendChild(d)});
  [['cal',S.cal,r=>[r.t,r.x]],['mail',S.mail,r=>[r.f,r.x]],['files',S.files,r=>[r.t,r.x]]].forEach(([id,a,fn])=>{const u=$(id);u.innerHTML='';
    a.forEach((r,i)=>{const li=document.createElement('li');li.innerHTML='<span class="t"></span><span class="x"></span>';const [p,q]=fn(r);li.children[0].textContent=p;li.children[1].textContent=q;
      if(r.u)li.classList.add('unread');if(fl===id&&i===a.length-1)li.classList.add('flash');u.appendChild(li)})})}
const askP=q=>new Promise(res=>confirmCard(q,res));
async function act(tool,args,fn,risky,q){if(risky&&!await askP(q)){toolLine(tool,args,'declined');say("Understood. I won't do that.");return false}
  await sleep(500);const r=fn();toolLine(tool,args,r);return true}
const rooms={kitchen:'Kitchen','living room':'Living room',living:'Living room',desk:'Desk'};
const hhmm=(h,m,ap)=>{h=+h;if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;return String(h).padStart(2,'0')+':'+String((m||':00').replace(':','')).padStart(2,'0')};
async function demo(raw){const s=raw.toLowerCase().trim();let m;
  if(/\b(what time|current time|what('| i)?s the time)\b/.test(s)){await act('get_time','()',()=>new Date().toLocaleString());say('It is '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'.');return}
  if(/\d/.test(s)&&/(times|plus|minus|divided|\*|\+|\/|\bx\b)/.test(s)&&!/(am|pm|calendar|:)/.test(s)){
    const ex=s.replace(/what('| i)?s|calculate|how much is|\bis\b/g,'').replace(/divided by/g,'/').replace(/times|multiplied by|\bx\b/g,'*').replace(/plus/g,'+').replace(/minus/g,'-').replace(/\?/g,'').trim();
    if(/^[\d\s.+\-*/()]+$/.test(ex)){let v;try{v=Function('"use strict";return ('+ex+')')()}catch(e){}
      if(v!==undefined&&isFinite(v)){await act('calculate',ex,()=>String(v));say(ex+' is '+(+v.toFixed(6))+'.');return}}}
  if((m=s.match(/(turn|switch)\s+(on|off)\s+(?:the\s+)?(all|kitchen|living room|living|desk)/))||(m=s.match(/(dim|set)\s+(?:the\s+)?(kitchen|living room|living|desk)(?:\s+lights?)?\s+to\s+(\d+)/))){
    const dim=m[1]==='dim'||m[1]==='set',all=!dim&&m[3]==='all',names=all?S.lights.map(l=>l.n):[rooms[dim?m[2]:m[3]]];
    const a=dim?`set ${names[0]} to ${m[3]}%`:`turn ${m[2]} ${all?'all lights':names[0]+' light'}`;
    if(await act('home_call',names.join(', '),()=>{names.forEach(n=>{const l=S.lights.find(x=>x.n===n);if(dim){l.on=true;l.p=Math.min(100,+m[3])}else l.on=m[2]==='on'});render(names[0]);return 'ok'},true,'Shall I '+a+'?'))say('Done.');return}
  if(/(calendar|schedule|agenda|what('| i)?s on)\b/.test(s)&&!/\badd\b|book/.test(s)){await act('calendar_list','(7 days)',()=>S.cal.map(e=>e.t+' '+e.x).join('; '));say('You have '+S.cal.map(e=>e.x+' at '+e.t.toLowerCase()).join(', and ')+'.');return}
  if((m=s.match(/(?:add|schedule|book)\s+(?:a |an )?(.+?)\s+(tomorrow|today)?\s*(?:at\s+)?(\d{1,2})(:\d\d)?\s*(am|pm)?\s*$/))){
    const T=m[1].replace(/\b(to my calendar|on my calendar|calendar)\b/g,'').trim().replace(/^./,c=>c.toUpperCase())||'New event',t=(/tomorrow/.test(s)?'Tomorrow ':'Today ')+hhmm(m[3],m[4],m[5]);
    if(await act('calendar_add',`"${T}" ${t}`,()=>{S.cal.push({t,x:T});render('cal');return 'created'},true,`Shall I add "${T}" at ${t.toLowerCase()}?`))say('Added to your calendar.');return}
  if((m=s.match(/(?:email|mail)\s+(\w+)\s+(?:saying|that|about)\s+(.+)/))){const to=m[1].replace(/^./,c=>c.toUpperCase());
    if(await act('email_send',`${to}: ${m[2]}`,()=>{S.mail.push({f:'You → '+to,x:m[2]});render('mail');return 'sent'},true,`Shall I email ${to}: "${m[2]}"?`))say('Sent.');return}
  if(/(unread|new|any)\s+(e-?mails?|messages)|inbox/.test(s)){const u=S.mail.filter(e=>e.u);await act('email_list','(unread)',()=>u.map(e=>e.f).join(', '));say(`You have ${u.length} unread, from `+u.map(e=>e.f).join(' and ')+'.');return}
  if((m=s.match(/(?:create|make|write)\s+(?:a\s+)?(?:file|note)\s+(?:called|named)?\s*([\w.-]+)(?:.*?(?:saying|with)\s+(.+))?/))){const n=m[1].includes('.')?m[1]:m[1]+'.txt';
    if(await act('write_file','~/Documents/'+n,()=>{S.files.push({t:'Documents',x:n});render('files');return 'written'},true,`Shall I write ~/Documents/${n}?`))say('Created '+n+'.');return}
  if((m=s.match(/open\s+(?:the\s+)?(\w[\w ]*)/))){await act('open_target',m[1],()=>'(demo: nothing opened)');say('Opening '+m[1]+'. The real version launches it on your computer.');return}
  if(/(search|latest|news|weather)/.test(s)){await act('web_search',raw,()=>'(demo: offline)');say('The real Jarvis would search the web here.');return}
  say('This demo only knows the example commands. The real Jarvis understands anything.')}

/* ---- chips, form, voice ---- */
['What time is it?','Turn on the kitchen light','Dim the living room to 30','Turn off all lights','What\'s on my calendar?','Add dentist follow-up tomorrow at 3pm','Any unread emails?','Email Maya saying Friday works','Create a file called ideas saying build jarvis','What is 17 times 23?'].forEach(t=>{
  const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>submit(t);$('chips').appendChild(b)});
$('f').addEventListener('submit',e=>{e.preventDefault();submit($('in').value)});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,on=false,awake=0;
$('mic').onclick=()=>{
  if(!SR){$('sub').textContent='Voice input needs Chrome or Edge, and a page that is allowed to use the microphone. Type for now.';return}
  if(on){on=false;rec&&rec.stop();$('mic').setAttribute('aria-pressed','false');setState('idle','Microphone off.');return}
  rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang='en-US';
  rec.onresult=e=>{const t=e.results[e.results.length-1][0].transcript.trim();if(Date.now()<mute||!t)return;const low=t.toLowerCase();
    if(pending){submit(t);return}
    const i=low.indexOf('jarvis');if(i>=0){awake=Date.now()+30000;submit(t.slice(i+6).replace(/^[ ,.]+/,'')||'yes?')}else if(Date.now()<awake)submit(t)};
  rec.onend=()=>{if(on)try{rec.start()}catch(e){}};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){on=false;$('mic').setAttribute('aria-pressed','false');$('sub').textContent='Microphone blocked here. Open this page in Chrome with the microphone allowed.'}};
  try{rec.start();on=true;$('mic').setAttribute('aria-pressed','true');setState('listening','Say "Jarvis, …"')}catch(e){$('sub').textContent='Could not start the microphone.'}};

if(LIVE){$('link').classList.add('live');$('linkv').textContent='CONNECTED';document.querySelector('.demo-only').parentNode;
  document.querySelectorAll('.demo-only').forEach(e=>e.hidden=true);document.querySelectorAll('.live-only').forEach(e=>e.hidden=false);$('chips').hidden=true;
  $('sub').textContent='Online. Tap MIC and say "Jarvis, …", or type.'}
else render();
line('jv',LIVE?'Jarvis online.':'Simulated demo. Tap an example below.');
</script>
