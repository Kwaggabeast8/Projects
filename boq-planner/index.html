<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>BOQ Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: header, sticky numbers strip, six workflow tabs; one full-width panel at a time. Plans and Projects replace the panel. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15212c; --muted:#5a6a79; --line:#d6dde4; --soft:#f4f7f9;
  --accent:#0a6c70; --accent-ink:#ffffff; --accent-soft:#d6eeee;
  --good:#1b7a47; --good-soft:#dcf1e5; --warn:#a85d00; --warn-soft:#fbead0; --bad:#b3261e; --bad-soft:#f9dedb;
  --bar:#9fb0bf; --grid:#e3e8ed;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'Barlow',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#17212b; --ink:#e7edf2; --muted:#93a4b3; --line:#2a3946; --soft:#1c2833;
  --accent:#3cc1c4; --accent-ink:#06282a; --accent-soft:#12383b;
  --good:#5fd08d; --good-soft:#143a26; --warn:#f0a94a; --warn-soft:#41300f; --bad:#ff8a80; --bad-soft:#47201d;
  --bar:#4a5d6e; --grid:#243340; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#17212b; --ink:#e7edf2; --muted:#93a4b3; --line:#2a3946; --soft:#1c2833;
  --accent:#3cc1c4; --accent-ink:#06282a; --accent-soft:#12383b;
  --good:#5fd08d; --good-soft:#143a26; --warn:#f0a94a; --warn-soft:#41300f; --bad:#ff8a80; --bad-soft:#47201d;
  --bar:#4a5d6e; --grid:#243340; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 56px}
.wrap{max-width:1160px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;line-height:1.1} h2{font-size:24px} h3{font-size:18px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:12.5px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
button,label.btn{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding-block:16px 12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:28px}
.hdr-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:13px;font-weight:500;text-decoration:none;color:var(--ink);line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:14px;max-width:240px}
.banner{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:8px 12px;border-radius:6px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.strip>div{background:var(--surface);padding:10px 14px;min-width:0}
.strip .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.strip .v{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.15;white-space:nowrap}
.strip .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.brand .eyebrow{display:none}.strip{grid-template-columns:repeat(2,1fr)}.strip .v{font-size:22px}}
nav.steps{display:flex;gap:2px;margin-top:16px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.steps button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.steps button .n{font-family:var(--f-mono);font-size:11px;margin-right:5px}
nav.steps button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:20px}
.panel.solo{border-top:1px solid var(--line);border-radius:8px;margin-top:16px}
.row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end}
.row>*{min-width:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.field input[type=text],.field input[type=date],.field select,.field textarea{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink);font-size:14px;width:100%}
.field input[type=range]{accent-color:var(--accent)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;margin-block:14px;background:var(--surface)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 14px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:9px 8px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
th.r{text-align:right}
td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:var(--soft)}
td input[type=text],td select{width:100%;background:var(--soft);border:1px solid transparent;border-radius:5px;padding:5px 6px;font-size:13px}
td input[type=text]:hover,td select:hover{border-color:var(--line)}
td input.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.mute{background:var(--soft);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-block:14px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.stat .v{font-family:var(--f-display);font-size:24px;font-weight:600}
.filein{font-size:13px;max-width:100%}.filein::file-selector-button{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;margin-right:10px;cursor:pointer}.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px 16px;background:var(--soft)}
.gantt{min-width:760px}
.g-head,.g-row{display:grid;grid-template-columns:210px 1fr;align-items:center}
.g-head{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
.g-axis{position:relative;height:16px}
.g-axis span{position:absolute;transform:translateX(-50%)}
.g-row{height:36px;border-bottom:1px solid var(--grid)}
.g-name{font-size:13px;padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-track{position:relative;height:100%;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px);background-size:var(--wk) 100%}
.g-bar{position:absolute;top:8px;height:20px;border-radius:4px;background:var(--bar);color:#fff;font-family:var(--f-mono);font-size:10.5px;display:flex;align-items:center;padding-inline:6px;white-space:nowrap;overflow:hidden}
.g-bar.crit{background:var(--accent);color:var(--accent-ink)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-block:12px 22px}
.pick{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pick.first{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pick .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pick .rank{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--accent)}
.contact{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px}
.contact .mono{font-size:12.5px;overflow-wrap:anywhere}
.best{background:var(--good-soft);color:var(--good);font-weight:600}
.rfq textarea{width:100%;min-height:230px;font-family:var(--f-mono);font-size:12.5px;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical}
.pl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:20px;align-items:start}
@media(max-width:860px){.pl{grid-template-columns:1fr}}
.verdict{border-radius:8px;padding:16px}
.verdict.good{background:var(--good-soft)} .verdict.bad{background:var(--bad-soft)}
.verdict .big{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1.05}
.verdict.good .big{color:var(--good)} .verdict.bad .big{color:var(--bad)}
.ledger{width:100%;margin-top:10px}
.ledger td{padding:5px 0;border:0;font-size:14px} .ledger tr.t td{border-top:1px solid var(--line);font-weight:600;padding-top:8px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.chart .ax{stroke:var(--line);stroke-width:1} .chart .gl{stroke:var(--grid);stroke-width:1}
details summary{cursor:pointer;font-family:var(--f-display);font-size:18px;font-weight:600;margin-block:18px 10px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-block:16px}
.plan{border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.plan.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.plan .price{font-family:var(--f-display);font-size:38px;font-weight:700;line-height:1}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:90vw}
.toast[hidden]{display:none}
.lock{opacity:.85}
@media print{header.top,.strip,nav.steps,.banner,.noprint,.toast{display:none!important}.panel{border:0;padding:0}body{background:#fff}}
@media (prefers-reduced-motion:no-preference){.g-bar{transition:left .25s,width .25s}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script>
/* ================= constants ================= */
const PHASES=[
 {id:1,name:'Site establishment',days:5,pred:[]},
 {id:2,name:'Excavation and footings',days:12,pred:[1]},
 {id:3,name:'Slab and damp-proofing',days:10,pred:[2]},
 {id:4,name:'Brickwork to wallplate',days:25,pred:[3]},
 {id:5,name:'Roof trusses and tiles',days:12,pred:[4]},
 {id:6,name:'Electrical and plumbing first fix',days:10,pred:[5]},
 {id:7,name:'Windows and doors',days:6,pred:[5]},
 {id:8,name:'Plaster and screed',days:14,pred:[6,7]},
 {id:9,name:'Ceilings and tiling',days:12,pred:[8]},
 {id:10,name:'Second fix and fittings',days:8,pred:[9]},
 {id:11,name:'Painting',days:10,pred:[10]},
 {id:12,name:'Snagging and handover',days:4,pred:[11]}
];
const CATS={general:'General and labour',concrete:'Concrete and cement',bricks:'Bricks and sand',timber:'Timber and doors',roofing:'Roofing',electrical:'Electrical',plumbing:'Plumbing and sanitary',glazing:'Windows and glass',finishes:'Plaster, ceilings, paint',tiles:'Tiles'};
const RULES=[
 [/truss|rafter|purlin/i,5,'timber'],
 [/roof|gutter|fascia|ridge|sheeting/i,5,'roofing'],
 [/floor tile|wall tile|tiling|\btiles?\b/i,9,'tiles'],
 [/ceiling|cornice|bulkhead/i,9,'finishes'],
 [/plaster|screed|render/i,8,'finishes'],
 [/paint|primer|varnish|enamel/i,11,'finishes'],
 [/hoarding|temporary|site office|setting out|establish|preliminar/i,1,'general'],
 [/snag|handover|final clean/i,12,'general'],
 [/sanitary|toilet|basin|bath|shower|\btap|geyser|kitchen|cupboard|vanity|fittings?/i,10,'plumbing'],
 [/plumb|pipe|waste|drain/i,6,'plumbing'],
 [/electric|wiring|cable|db board|conduit|socket|switch|light|distribution/i,6,'electrical'],
 [/window|glass|glaz|aluminium|burglar/i,7,'glazing'],
 [/door|frame|architrave/i,7,'timber'],
 [/excavat|trench|earthwork|backfill/i,2,'general'],
 [/hardcore|surface bed|slab|dpc|dpm|damp/i,3,'concrete'],
 [/footing|foundation|rebar|reinforc|concrete|readymix/i,2,'concrete'],
 [/cement/i,4,'concrete'],
 [/brick|block|mortar|sand|stone|lintel|wall/i,4,'bricks']
];
function guess(desc){for(const r of RULES)if(r[0].test(desc))return {ph:r[1],cat:r[2]};return {ph:4,cat:'general'}}
const SAMPLE_ITEMS=[
 ['Site hoarding, toilet, temporary water and power','sum',1,18500],['Setting out by surveyor','sum',1,6500],
 ['Excavate trenches','m³',42,185],['Strip footings, 25 MPa concrete','m³',18,2350],
 ['Hardcore, compacted','m³',30,420],['Surface bed 100 mm with mesh','m²',180,365],['DPC and DPM','m²',180,48],
 ['Clay stock bricks','no.',14500,3.85],['Cement, 50 kg bags','bag',160,118],['Building sand','m³',22,520],['Brickforce, 75 mm','roll',40,62],
 ['Timber roof trusses, erected','m²',200,540],['Concrete roof tiles','m²',200,260],
 ['Electrical first fix and DB board','sum',1,38000],['Plumbing first fix','sum',1,32000],
 ['Aluminium windows','no.',12,3400],['Internal and external doors','no.',9,2800],
 ['Plaster to walls','m²',520,95],['Ceiling boards and cornice','m²',170,135],['Floor tiles, supply and lay','m²',150,310],
 ['Sanitaryware and kitchen fittings','sum',1,28000],['Paint, 2 coats','m²',780,48],['Snagging crew','sum',1,7500]];
const SAMPLE_SUPS=[
 ['Ridgeway Builders Merchant','Halfway House',4.2,'011 555 0142','orders@ridgeway-merchant.example',1,['concrete','bricks','general','finishes','electrical']],
 ['Kopje Cement and Aggregates','Kyalami',9.8,'011 555 0177','sales@kopje-cement.example',1,['concrete','bricks']],
 ['Northgate Brick and Block','Olifantsfontein',12.5,'011 555 0121','quotes@northgate-brick.example',2,['bricks','concrete','roofing']],
 ['Metro Timber and Roofing','Midrand',7.1,'011 555 0190','trade@metro-timber.example',3,['timber','roofing','glazing']],
 ['Allied Trade Depot','Randjespark',15.3,'011 555 0108','accounts@allied-depot.example',2,['general','timber','finishes','plumbing','electrical','tiles','glazing','roofing']],
 ['Karoo Tiles and Sanitary','Waterfall',6.4,'011 555 0163','info@karoo-tiles.example',4,['tiles','plumbing','finishes']],
 ['Sparkline Electrical Wholesale','Midrand',5.0,'011 555 0135','sales@sparkline-elec.example',1,['electrical','general']],
 ['Aquaflow Plumbing Supplies','Halfway House',8.8,'011 555 0154','orders@aquaflow.example',2,['plumbing','general']],
 ['Frameline Aluminium and Doors','Kyalami',11.0,'011 555 0116','quotes@frameline.example',10,['glazing','timber']],
 ['ColourCoat Paints and Plaster','Midrand',3.6,'011 555 0129','trade@colourcoat.example',1,['finishes','tiles']]];
const REF_BUDGET=SAMPLE_ITEMS.reduce((a,i)=>a+i[2]*i[3],0);

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const R=n=>(n<0?'-':'')+'R '+Math.round(Math.abs(n)).toLocaleString('en-ZA').replace(/\s/g,' ');
const R2=n=>'R '+Number(n).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\s/g,' ');
const pct=n=>(n>=0?'+':'')+n.toFixed(1)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hsh=s=>{let x=7;for(const c of s)x=(x*31+c.charCodeAt(0))>>>0;return x};
const fmtD=d=>d.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'});
const fmtDs=d=>d.toLocaleDateString('en-ZA',{day:'numeric',month:'short'});
function num(v){if(v==null)return null;let s=String(v).replace(/[R\s ]/gi,'');if(s==='')return null;
  if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');else s=s.replace(',','.');
  const n=parseFloat(s);return isNaN(n)?null:n}
const tot=i=>(Number(i.qty)||0)*(Number(i.rate)||0);
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3600)}
function copyText(txt,msg){
  const fb=()=>{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast(msg||'Copied')}catch(e){toast('Select the text and copy it by hand')}t.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast(msg||'Copied'),fb);else fb();
}
function saveText(name,text,mime){
  try{const b=new Blob([text],{type:mime||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Saving '+name+'. If nothing downloads, use Copy.')}catch(e){toast('Could not save. Use Copy instead.')}
}
const csvCell=v=>{const s=String(v==null?'':v);return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\n');
function waNumber(p){let d=String(p).replace(/\D/g,'');if(d.startsWith('0'))d='27'+d.slice(1);return d}

/* ================= storage ================= */
const LS='boqplanner.v1';
let store=null,mem=null;
function loadStore(){try{const t=localStorage.getItem(LS);if(t)return JSON.parse(t)}catch(e){}return null}
function saveStore(){store.updatedAt=new Date().toISOString();mem=store;try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}
  if(cloudOn()&&sess&&pro()){clearTimeout(saveStore.t);saveStore.t=setTimeout(()=>pushWorkspace().catch(()=>{}),2500)}}

/* ---- optional online accounts and sync (Supabase). Off unless config.js is filled in. ---- */
const CFG=window.BOQ_CONFIG||{};
const cloudOn=()=>!!(CFG.supabaseUrl&&CFG.supabaseAnonKey);
let sess=null;
try{sess=JSON.parse(localStorage.getItem('boq.session')||'null')}catch(e){}
function setSess(x){sess=x;try{x?localStorage.setItem('boq.session',JSON.stringify(x)):localStorage.removeItem('boq.session')}catch(e){}}
async function sbFetch(path,opts={},auth=true){
  if(auth&&sess&&sess.expires_at*1000<Date.now()+60000)await refreshSess();
  const h={apikey:CFG.supabaseAnonKey,'Content-Type':'application/json',Authorization:'Bearer '+(auth&&sess?sess.access_token:CFG.supabaseAnonKey),...(opts.headers||{})};
  const r=await fetch(CFG.supabaseUrl+path,{...opts,headers:h});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((j&&(j.msg||j.message||j.error_description||j.error))||('Request failed ('+r.status+')'));
  return j;
}
async function refreshSess(){
  try{const j=await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:sess.refresh_token})},false);setSess({...j,expires_at:Math.floor(Date.now()/1000)+j.expires_in})}

function parseCSV(text){
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const d=first.includes('\t')?'\t':((first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',');
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  row.push(f);rows.push(row);
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function mapBOQ(rows){
  const low=r=>r.map(c=>String(c==null?'':c).toLowerCase());
  let hi=-1,cols={};
  for(let i=0;i<Math.min(rows.length,30);i++){
    const r=low(rows[i]);
    let d=r.findIndex(c=>/desc|particular|detail/.test(c));if(d<0)d=r.findIndex(c=>/item|work/.test(c));
    const q=r.findIndex(c=>/qty|quant/.test(c));
    if(d>=0&&q>=0){hi=i;cols={d,q,u:r.findIndex(c=>/^units?$|^uom$|^u\/m$/.test(c)),r:r.findIndex(c=>/rate|price/.test(c)),a:r.findIndex(c=>/amount|total|value/.test(c))};break}
  }
  let note='';
  if(hi<0){hi=0;cols={d:0,u:1,q:2,r:3,a:4};note='No header row found, so columns were read as Description, Unit, Quantity, Rate, Amount.';
    const f=rows[0]||[];if(f.length&&num(f[2])===null&&num(f[0])!==null){cols={d:1,u:2,q:3,r:4,a:5}}
    hi=-1}
  const out=[];
  rows.slice(hi+1).forEach(r=>{
    const desc=String(r[cols.d]==null?'':r[cols.d]).trim();const qty=num(r[cols.q]);
    if(!desc||qty===null||qty<=0)return;
    let rate=cols.r>=0?num(r[cols.r]):null;
    const amt=cols.a>=0?num(r[cols.a]):null;
    if((rate===null||rate===0)&&amt&&qty)rate=amt/qty;
    out.push({id:'i'+uid(),desc,unit:cols.u>=0?String(r[cols.u]||'').trim()||'no.':'no.',qty,rate:rate||0,...guess(desc)});
  });
  return {items:out,note};
}
async function readFileRows(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(['csv','tsv','txt'].includes(ext))return parseCSV(await file.text());
  if(['xlsx','xls','xlsm'].includes(ext)){
    try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js')}catch(e){throw new Error('The Excel reader could not be loaded. Check your internet connection, or save the sheet as CSV.')}
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    let best=[];wb.SheetNames.forEach(n=>{const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});if(r.length>best.length)best=r});
    return best.filter(r=>r.some(c=>String(c).trim()!==''));
  }
  throw new Error('Price lists can be Excel, CSV or pasted text.');
}

const LIBS={

const _loaded={};
function loadScript(u){return _loaded[u]||(_loaded[u]=new Promise((res,rej)=>{const e=document.createElement('script');e.src=u;e.onload=res;e.onerror=()=>{delete _loaded[u];rej(new Error('A reading helper could not be loaded. Check your internet connection and try again.'))};document.head.appendChild(e)}))}
function progress(m){ui.impBusy=m;render()}
const UNITS=new Set(['m','m2','m²','m3','m³','no','no.','nr','sum','item','bag','bags','roll','rolls','kg','t','l','ea','each','lm','hr','hrs','day','days','set','pair','pc','pcs','sqm','cum','mm','ton','tons','week','weeks','allow','ps','prov']);
function linesToItems(lines){
  const out=[];
  lines.forEach(line=>{
    let tk=String(line).replace(/ /g,' ').trim().split(/\s+/).filter(Boolean);if(tk.length<3)return;
    const nums=[];while(tk.length>1&&nums.length<3&&num(tk[tk.length-1])!==null&&!/^[A-Za-z]/.test(tk[tk.length-1].replace(/^R/i,'')))nums.unshift(num(tk.pop()));
    if(nums.length<2)return;
    let unit='no.';if(tk.length>1&&UNITS.has(tk[tk.length-1].toLowerCase().replace(/[^a-z0-9²³.]/g,'')))unit=tk.pop().replace(/m2$/,'m²').replace(/m3$/,'m³');
    if(tk.length>1&&/^[A-Za-z]?\d+(\.\d+)*[.)]?$|^[A-Z]{1,2}\d*[.)]?$/.test(tk[0])&&tk.length>2)tk.shift();
    const desc=tk.join(' ').replace(/[.…_]{3,}/g,'').trim();
    if(desc.length<3||!/[A-Za-z]{2}/.test(desc))return;
    let qty,rate;if(nums.length===3){qty=nums[0];rate=nums[1]}else{qty=nums[0];rate=nums[1]}
    if(!(qty>0))return;
    out.push({id:'i'+uid(),desc,unit,qty,rate:rate||0,...guess(desc)});
  });
  return out;
}
async function pdfLines(buf,onPage){
  await loadScript(LIBS.pdf);
  try{const t=await (await fetch(LIBS.pdfWorker)).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:'text/javascript'}))}catch(e){pdfjsLib.GlobalWorkerOptions.workerSrc=LIBS.pdfWorker}
  const doc=await pdfjsLib.getDocument({data:buf}).promise;const lines=[];const pages=[];
  for(let n=1;n<=doc.numPages;n++){
    const pg=await doc.getPage(n);const tc=await pg.getTextContent();
    const rows=[];tc.items.forEach(it=>{if(!it.str.trim())return;const y=it.transform[5],x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,cells:[]};rows.push(r)}r.cells.push({x,t:it.str})});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>lines.push(r.cells.sort((a,b)=>a.x-b.x).map(c=>c.t.trim()).join(' ')));
    pages.push(pg);if(onPage)onPage(n,doc.numPages);
  }
  return {lines,pages};
}
async function ocrWorker(){
  await loadScript(LIBS.tess);
  return await Promise.race([Tesseract.createWorker('eng',1,{langPath:LIBS.lang,logger:m=>{if(m.status==='recognizing text')progress('Reading the text… '+Math.round(m.progress*100)+'%')}}),new Promise((_,r)=>setTimeout(()=>r(new Error('Text recognition could not start. It needs an internet connection the first time, and may not run inside this preview.')),60000))]);
}
async function extractItems(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(['csv','tsv','txt','xlsx','xls','xlsm'].includes(ext)){const m=mapBOQ(await readFileRows(file));return m}
  if(ext==='docx'){
    await loadScript(LIBS.mammoth);progress('Reading the Word file…');
    const r=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});
    const doc=new DOMParser().parseFromString(r.value,'text/html');
    const tables=[...doc.querySelectorAll('table')].map(t=>[...t.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>c.textContent.trim())));
    let items=[];tables.forEach(t=>{const m=mapBOQ(t);items=items.concat(m.items)});
    if(items.length)return {items,note:'Read from the tables in the Word file. Check the quantities and rates.'};
    return {items:linesToItems([...doc.querySelectorAll('p,li')].map(p=>p.textContent)),note:'Read from the text in the Word file. Check the quantities and rates.'};
  }
  if(ext==='pdf'){
    progress('Opening the PDF…');
    const buf=await file.arrayBuffer();
    const {lines,pages}=await pdfLines(buf,(n,t)=>progress('Reading PDF page '+n+' of '+t+'…'));
    let items=linesToItems(lines);
    if(items.length)return {items,note:'Read from the text in the PDF. Check the quantities and rates.'};
    if(lines.join('').length>200)return {items:[],note:''};
    progress('This PDF is a scan. Starting text recognition…');
    const w=await ocrWorker();let all=[];
    for(let n=0;n<pages.length;n++){const vp=pages[n].getViewport({scale:2.2});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pages[n].render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;const r=await w.recognize(cv);all=all.concat(r.data.text.split('\n'))}
    await w.terminate();
    return {items:linesToItems(all),note:'Read from a scanned PDF using text recognition. Check every quantity and rate.'};
  }
  if(['jpg','jpeg','png','webp','bmp','gif'].includes(ext)){
    progress('Starting text recognition…');
    const w=await ocrWorker();const r=await w.recognize(file);await w.terminate();
    return {items:linesToItems(r.data.text.split('\n')),note:'Read from a photo using text recognition. Check every quantity and rate.'};
  }
  throw new Error('That file type cannot be read. Use Excel, CSV, PDF, Word or a photo.');
}

/* ================= calculations ================= */
function workdays(P){
  const out=[];let d=new Date(P.start+'T00:00:00');if(isNaN(d))d=new Date();
  while(out.length<700){
    const dow=d.getDay(),m=d.getMonth()+1,day=d.getDate();
    const brk=P.xmas&&((m===12&&day>=15)||(m===1&&day<=12));
    if(dow!==0&&dow!==6&&!brk)out.push(new Date(d));
    d=new Date(d.getTime()+86400000);
  }
  return out;
}
function schedule(P){
  const budget=P.items.reduce((a,i)=>a+tot(i),0);
  const scale=Math.min(3,Math.max(.5,Math.sqrt((budget||REF_BUDGET)/REF_BUDGET)));
  const f=P.pace*(P.weather?1.1:1)*scale;
  const active=id=>P.items.some(i=>i.ph===id);
  const t={};PHASES.forEach(p=>{const ov=P.phaseDays[p.id];t[p.id]={...p,on:active(p.id),d:active(p.id)?(ov>0?ov:Math.max(1,Math.ceil(p.days*f))):0,ov:ov>0,es:0,ef:0}});
  PHASES.forEach(p=>{const x=t[p.id];x.es=Math.max(0,...p.pred.map(q=>t[q].ef));x.ef=x.es+x.d});
  const end=Math.max(0,...PHASES.map(p=>t[p.id].ef));
  [...PHASES].reverse().forEach(p=>{const x=t[p.id];const succ=PHASES.filter(q=>q.pred.includes(p.id));x.lf=succ.length?Math.min(...succ.map(q=>t[q.id].ls)):end;x.ls=x.lf-x.d;x.slack=x.ls-x.es;x.crit=x.on&&x.slack===0});
  return {t,end,days:workdays(P),scale};
}
function quotesFor(P,it){
  const q=P.quotes[it.id]||{};
  return store.suppliers.filter(s=>q[s.id]>0&&(s.km==null||s.km<=P.radius)).map(s=>({s,rate:q[s.id],total:q[s.id]*it.qty})).sort((a,b)=>a.rate-b.rate);
}
function calc(P){
  const sch=schedule(P);const q={};P.items.forEach(i=>q[i.id]=quotesFor(P,i));
  const line=i=>{const paid=P.actual[i.id];const best=q[i.id][0]?q[i.id][0].total:null;
    return paid!==undefined&&paid!==''?{paid:+paid,fc:+paid,state:'paid'}:best!==null?{paid:null,fc:best,state:'quoted'}:{paid:null,fc:tot(i),state:'budget'}};
  const L={};P.items.forEach(i=>L[i.id]=line(i));
  const budget=P.items.reduce((a,i)=>a+tot(i),0);
  const bestCost=P.items.reduce((a,i)=>a+(q[i.id][0]?q[i.id][0].total:tot(i)),0);
  const forecast=P.items.reduce((a,i)=>a+L[i.id].fc,0);
  const paid=P.items.reduce((a,i)=>a+(L[i.id].paid||0),0);
  const needQuote=P.items.filter(i=>!q[i.id].length).length;
  const planWeeks=sch.end/5,actWeeks=(sch.end+(P.delay||0))/5;
  const planOH=planWeeks*P.overhead,actOH=actWeeks*P.overhead;
  const varIncome=P.variations.reduce((a,v)=>a+(+v.income||0),0),varCost=P.variations.reduce((a,v)=>a+(+v.cost||0),0);
  const totalBudget=budget+planOH;
  const contract=totalBudget*(1+P.markup/100);
  const totalCost=forecast+actOH;
  const profit=contract+varIncome-totalCost-varCost;
  return {sch,q,L,budget,bestCost,forecast,paid,needQuote,planWeeks,actWeeks,planOH,actOH,varIncome,varCost,totalBudget,contract,totalCost,profit,plannedProfit:contract-totalBudget,saving:budget-bestCost};
}
function rankSuppliers(P,c){
  const m={};
  P.items.forEach(i=>{const w=c.q[i.id][0];if(w){const x=m[w.s.id]||(m[w.s.id]={s:w.s,n:0,save:0});x.n++;x.save+=tot(i)-w.total}});
  return Object.values(m).sort((a,b)=>b.save-a.save);
}
function curve(P,c){
  const W=Math.max(1,Math.ceil(c.sch.end/5));const pl=Array(W+1).fill(0),ac=Array(W+1).fill(0);
  PHASES.forEach(p=>{const x=c.sch.t[p.id];if(!x.on||!x.d)return;
    const its=P.items.filter(i=>i.ph===p.id);const b=its.reduce((a,i)=>a+tot(i),0),a=its.reduce((s,i)=>s+c.L[i.id].fc,0);
    for(let d=x.es;d<x.ef;d++){const w=Math.floor(d/5);pl[w]+=b/x.d;ac[w]+=a/x.d}});
  for(let w=0;w<W;w++){pl[w]+=P.overhead;ac[w]+=P.overhead}
  const cum=a=>{let s=0;return [0,...a.slice(0,W).map(v=>s+=v)]};
  return {W,plan:cum(pl),act:cum(ac)};
}
function chartSVG(P,c){
  const {W,plan,act}=curve(P,c);
  const f=Math.max(1,c.actWeeks/Math.max(c.planWeeks,.01));const WA=Math.max(W,Math.ceil(W*f));
  const at=w=>{const t=w/f;if(t>=W)return act[W];const i=Math.floor(t),fr=t-i;return act[i]+(act[i+1]-act[i])*fr};
  const st=Math.min(P.status,WA);const actPts=[];for(let w=0;w<=st;w++)actPts.push([w,at(w)]);
  const ymax=Math.max(c.contract,c.totalCost,plan[W],1)*1.06,xmax=WA;
  const L=56,T=12,Wd=640,H=270,Rr=14,B=30,pw=Wd-L-Rr,ph=H-T-B;
  const X=w=>L+w/xmax*pw,Y=v=>T+ph-v/ymax*ph;
  const path=pts=>pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  let grid='';const step=ymax>6e6?2e6:ymax>2.5e6?1e6:5e5;
  for(let v=0;v<=ymax;v+=step)grid+=`<line class="gl" x1="${L}" x2="${Wd-Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">R${(v/1e6).toFixed(1)}m</text>`;
  for(let w=0;w<=xmax;w+=4)grid+=`<text x="${X(w)}" y="${H-12}" text-anchor="middle">wk ${w}</text>`;
  const last=actPts[actPts.length-1],flip=last[0]>xmax*0.75;
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Cumulative cost by week: planned, forecast and contract price">
   ${grid}<line class="ax" x1="${L}" x2="${Wd-Rr}" y1="${Y(0)}" y2="${Y(0)}"/>
   <line x1="${L}" x2="${Wd-Rr}" y1="${Y(c.contract)}" y2="${Y(c.contract)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/>
   <text x="${Wd-Rr}" y="${Y(c.contract)-5}" text-anchor="end" style="fill:var(--good)">Contract price ${R(c.contract)}</text>
   <path d="${path(plan.map((v,i)=>[i,v]))}" fill="none" stroke="var(--bar)" stroke-width="2.5"/>
   <path d="${path(actPts)}" fill="none" stroke="var(--accent)" stroke-width="3"/>
   <circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4.5" fill="var(--accent)"/>
   <text x="${X(last[0])+(flip?-8:8)}" y="${Y(last[1])+(flip?16:-8)}" text-anchor="${flip?'end':'start'}" style="fill:var(--ink)">${R(last[1])} by wk ${last[0]}</text></svg>`;
}

function renderStrip(P,c){

  const diff=c.totalBudget-c.totalCost;
  return `<section class="strip" aria-label="Project summary">

   <label class="field">Crew pace${sel('id="p_pace" data-k="pace" data-n="1"',[[1.15,'Small crew (+15%)'],[1,'Normal crew'],[0.85,'Extra team (-15%)']],P.pace)}</label>

   <label class="check"><input type="checkbox" id="p_xmas" data-k="xmas" ${P.xmas?'checked':''}> Builders' break, 15 Dec to 12 Jan</label></div>
  <div class="stats"><div class="stat"><div class="eyebrow">Working days</div><div class="v">${end}</div></div><div class="stat"><div class="eyebrow">Duration</div><div class="v">${c.planWeeks.toFixed(1)} weeks</div></div><div class="stat"><div class="eyebrow">Practical completion</div><div class="v">${fmtDs(days[end-1])} ${days[end-1].getFullYear()}</div></div><div class="stat"><div class="eyebrow">Critical phases</div><div class="v">${act.filter(p=>t[p.id].crit).length} of ${act.length}</div></div></div>

function contactHtml(s){

}
function rfqText(P,c,s){
  const lines=P.items.filter(i=>s.cats.includes(i.cat));
  const subject=`Quote request – ${P.name||'project'}${P.site?', '+P.site:''}`;
  const body=`Hi ${s.name.split(' ')[0]} team,

Please quote delivered to site${P.site?' ('+P.site+')':''} for:

${lines.map(i=>`- ${i.desc}: ${i.qty.toLocaleString('en-ZA')} ${i.unit}`).join('\n')}

Please include the price per unit, delivery lead time, how long the quote is valid, and your account terms. Delivery is needed from ${c.sch.days.length?fmtD(c.sch.days[0]):'the start date'}.

Thank you,
[Your name]
[Your company] · [Your phone]`;
  return {subject,body,count:lines.length};
}

  if(fid){const el=document.getElementById(fid);if(el){if(keep!==undefined&&el.tagName==='INPUT'&&el.type==='text')el.value=keep;el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}}

/* ================= events ================= */
function applyField(obj,f,t){
  if(['qty','rate','km','lead','income','cost'].includes(f)){const n=num(t.value);obj[f]=n===null?(f==='km'||f==='lead'?null:0):n}
  else if(f==='ph')obj[f]=+t.value;else obj[f]=t.value;
}
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset,P=cur();let renderIt=!d.nr;
  if(d.k){const k=d.k;let v=t.type==='checkbox'?t.checked:t.value;if(d.n!==undefined){v=num(v);if(v===null)v=0}P[k]=v}
  else if(d.item){const it=P.items.find(i=>i.id===d.item);if(it)applyField(it,d.f,t)}
  else if(d.paid){if(t.value.trim()==='')delete P.actual[d.paid];else{const n=num(t.value);if(n!==null)P.actual[d.paid]=n}}
  else if(d.q){const [iid,sid]=d.q.split('|');const n=num(t.value);P.quotes[iid]=P.quotes[iid]||{};if(n>0)P.quotes[iid][sid]=n;else delete P.quotes[iid][sid]}
  else if(d.sup){const s=store.suppliers.find(x=>x.id===d.sup);if(s)applyField(s,d.f,t)}
  else if(d.supcat){const s=store.suppliers.find(x=>x.id===d.supcat);if(s){s.cats=s.cats.filter(k=>k!==d.cat);if(t.checked)s.cats.push(d.cat)}}
  else if(d.var){const v=P.variations.find(x=>x.id===d.var);if(v)applyField(v,d.f,t)}
  else if(d.phd){const n=num(t.value);if(n>0)P.phaseDays[d.phd]=Math.round(n);else delete P.phaseDays[d.phd]}
  else if(d.ui){ui[d.ui]=t.value;if(d.ui==='impMode'&&ui.imp)ui.imp.mode=t.value;renderIt=true}
  else if(d.pm!==undefined){ui.pimp.rows[+d.pm].on=t.checked}
  else return;
  saveStore();if(renderIt)render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.nr){saveStore();render();return}
  if(t.id==='boqfile'&&t.files[0])handleBOQFile(t.files[0]);
  if(t.id==='pricefile'&&t.files[0])handlePriceFile(t.files[0]);
  if(t.dataset.act==='openSel'){store.cur=t.value;ui.imp=null;ui.rfq=null;saveStore();render()}
  if(t.dataset.ui==='impMode'&&ui.imp)ui.imp.mode=t.value;
});
async function handleBOQFile(f){
  ui.impMsg='';ui.impBusy='Reading '+f.name+'…';ui.imp=null;render();
  try{const m=await extractItems(f);
    if(!m.items.length){ui.impMsg='No lines with a description and a quantity were found. Check that the file has columns for description, quantity and rate.';ui.imp=null}
    else ui.imp={name:f.name,items:m.items,note:m.note,mode:cur().items.length?'append':'replace'};
  }catch(err){ui.impMsg=err.message||'That file could not be read.';ui.imp=null}
  ui.impBusy='';render();
}
function tokens(s){const stop=new Set(['and','the','for','with','supply','supplied','fix','fixed','incl','including','per','each','all','from']);return new Set(String(s).toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!stop.has(w)).map(w=>w.length>4?w.slice(0,4):w.replace(/s$/,'')))}
function buildPriceImport(name,rows){
  const P=cur();const out=[];
  rows.forEach(r=>{
    const cells=r.map(c=>c==null?'':c);let price=null,pi=-1;
    for(let i=cells.length-1;i>=0;i--){const n=num(cells[i]);if(n!==null&&n>0){price=n;pi=i;break}}
    const desc=cells.find((c,i)=>i!==pi&&String(c).trim().length>2&&num(c)===null);
    if(price===null||!desc)return;
    const a=tokens(desc);let best=null,bs=0;
    P.items.forEach(it=>{const b=tokens(it.desc);let k=0;a.forEach(w=>{if(b.has(w))k++});const s=k/Math.max(1,Math.min(a.size,b.size));if(k>=1&&s>bs){bs=s;best=it.id}});
    out.push({desc:String(desc).trim(),price,item:bs>=0.5?best:null,on:bs>=0.5});
  });
  return out.length?{name,rows:out}:null;
}
async function handlePriceFile(f){
  if(!pro()){ui.pimpMsg='Price-list import is part of Pro.';render();return}
  ui.pimpMsg='';
  try{const rows=await readFileRows(f);ui.pimp=buildPriceImport(f.name,rows);if(!ui.pimp)ui.pimpMsg='No description and price pairs were found.'}
  catch(err){ui.pimpMsg=err.message}
  render();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  const act=b.dataset.act,arg=b.dataset.arg,P=cur();
  const lockIt=m=>{toast(m);ui.view='plans';render()};
  switch(act){
   case 'tab':ui.tab=arg;ui.confirm='';render();break;
   case 'view':ui.view=arg;ui.confirm='';render();break;
   case 'theme':{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';break}
   case 'copy':copyText(arg);break;
   case 'newBlank':{const p=blankProject('My project');if(P.sample){store.projects=store.projects.filter(x=>x.id!==P.id)}store.projects.push(p);store.cur=p.id;ui.tab='boq';saveStore();render();break}
   case 'newProj':{if(!pro()&&store.projects.length>=1){
       if(P.sample&&store.projects.length===1){const p=blankProject('My project');store.projects=[p];store.cur=p.id;ui.view='app';ui.tab='boq';saveStore();render()}
       else lockIt('The Free plan keeps one project. Upgrade to add more.');break}
     const p=blankProject('New project');store.projects.push(p);store.cur=p.id;ui.view='app';ui.tab='boq';saveStore();render();break}
   case 'loadSample':{if(!store.suppliers.length)store.suppliers=sampleSuppliers();const p=sampleProject(store.suppliers);P.items=p.items;P.quotes=p.quotes;P.sample=true;P.name=P.name==='New project'||P.name==='My project'?'Smith residence':P.name;saveStore();render();break}
   case 'openProj':store.cur=arg;ui.view='app';ui.imp=null;ui.rfq=null;saveStore();render();break;
   case 'dupProj':{if(!pro())return lockIt('Copying projects is part of Pro.');const s=store.projects.find(x=>x.id===arg);const p=JSON.parse(JSON.stringify(s));p.id=uid();p.name=s.name+' copy';p.sample=false;store.projects.push(p);saveStore();render();break}
   case 'delProj':ui.confirm='proj:'+arg;render();break;
   case 'delProjYes':{store.projects=store.projects.filter(x=>x.id!==arg);if(!store.projects.length)store.projects.push(blankProject('My project'));store.cur=store.projects[0].id;ui.confirm='';saveStore();render();break}
   case 'plan':store.plan=arg;saveStore();toast('Plan switched to '+arg+' (demo only, no payment taken)');render();break;
   case 'addItem':{const it={id:'i'+uid(),desc:'',unit:'no.',qty:1,rate:0,ph:4,cat:'general'};P.items.push(it);saveStore();render();const el=document.getElementById('d_'+it.id);if(el)el.focus();break}
   case 'delItem':ui.confirm='item:'+arg;render();break;
   case 'delItemYes':P.items=P.items.filter(i=>i.id!==arg);delete P.quotes[arg];delete P.actual[arg];ui.confirm='';saveStore();render();break;
   case 'impPaste':{const t=$('#pastebox').value;if(!t.trim()){ui.impMsg='Paste a table first.';render();break}
     const m=mapBOQ(parseCSV(t));ui.impMsg=m.items.length?'':'No lines with a description and a quantity were found.';ui.imp=m.items.length?{name:'pasted table',items:m.items,note:m.note,mode:P.items.length?'append':'replace'}:null;render();break}
   case 'impApply':{const im=ui.imp;if(im.mode==='replace'){P.items=im.items;P.quotes={};P.actual={};P.phaseDays={}}else P.items=P.items.concat(im.items);
     P.sample=false;ui.imp=null;ui.impMsg='';saveStore();toast('Imported '+im.items.length+' lines');render();break}
   case 'impCancel':ui.imp=null;render();break;
   case 'geo':{
     const fail=m=>{ui.geoMsg=m;render()};
     if(!navigator.geolocation)return fail('Location is not available here. Type the suburb instead.');
     ui.geoMsg='Asking your device…';render();
     navigator.geolocation.getCurrentPosition(p=>{P.lat=p.coords.latitude;P.lon=p.coords.longitude;if(!P.site)P.site=P.lat.toFixed(4)+', '+P.lon.toFixed(4);ui.geoMsg='Located, accurate to about '+Math.round(p.coords.accuracy)+' m.';saveStore();render()},
       ()=>fail('Location was not allowed or is blocked here. Type the suburb instead.'),{timeout:8000});break}
   case 'rfq':ui.rfq=arg;render();setTimeout(()=>{const x=$('#rfqtxt');if(x)x.scrollIntoView({behavior:'smooth',block:'center'})},30);break;
   case 'rfqClose':ui.rfq=null;render();break;
   case 'copyRfq':copyText($('#rfqtxt').value,'Email text copied');break;
   case 'markReq':P.rfq[arg]=!P.rfq[arg];saveStore();render();break;
   case 'addSup':store.suppliers.push({id:'s'+uid(),name:'New supplier',area:'',km:null,phone:'',email:'',lead:null,cats:['general']});saveStore();render();break;
   case 'delSup':ui.confirm='sup:'+arg;render();break;
   case 'delSupYes':store.suppliers=store.suppliers.filter(s=>s.id!==arg);store.projects.forEach(p=>Object.values(p.quotes).forEach(q=>delete q[arg]));ui.confirm='';saveStore();render();break;
   case 'clearSampleSups':{const ids=store.suppliers.filter(s=>s.sample).map(s=>s.id);store.suppliers=store.suppliers.filter(s=>!s.sample);store.projects.forEach(p=>Object.values(p.quotes).forEach(q=>ids.forEach(i=>delete q[i])));saveStore();render();break}
   case 'pimpPaste':{if(!pro())return lockIt('Price-list import is part of Pro.');const t=$('#pricepaste').value;ui.pimpMsg='';ui.pimp=buildPriceImport('pasted list',parseCSV(t));if(!ui.pimp)ui.pimpMsg='No description and price pairs were found.';render();break}
   case 'pimpApply':{const sid=ui.pimpSup||(store.suppliers[0]&&store.suppliers[0].id);let n=0;ui.pimp.rows.forEach(r=>{if(r.on&&r.item){P.quotes[r.item]=P.quotes[r.item]||{};P.quotes[r.item][sid]=r.price;n++}});ui.pimp=null;saveStore();toast('Saved '+n+' prices');render();break}
   case 'pimpCancel':ui.pimp=null;render();break;
   case 'resetDays':delete P.phaseDays[arg];saveStore();render();break;
   case 'addVar':P.variations.push({id:'v'+uid(),desc:'',income:0,cost:0});saveStore();render();break;
   case 'delVar':P.variations=P.variations.filter(v=>v.id!==arg);saveStore();render();break;
   case 'copySummary':copyText(summaryText(P,calc(P)),'Summary copied');break;
   case 'print':if(!pro())return lockIt('Printing reports is part of Pro.');window.print();break;
   case 'exportBOQ':{if(!pro())return lockIt('CSV export is part of Pro.');
     saveText((P.name||'boq')+' BOQ.csv',toCSV([['Ref','Description','Unit','Qty','Rate','Amount','Work section','Category'],...P.items.map((i,n)=>[n+1,i.desc,i.unit,i.qty,i.rate,tot(i),PHASES.find(p=>p.id===i.ph).name,CATS[i.cat]])]),'text/csv');break}
   case 'exportCmp':{if(!pro())return lockIt('CSV export is part of Pro.');const c=calc(P);
     saveText((P.name||'project')+' comparison.csv',toCSV([['Item','Qty','Unit','Budget rate','Best supplier','Best rate','Saving'],...P.items.map(i=>{const w=c.q[i.id][0];return [i.desc,i.qty,i.unit,i.rate,w?w.s.name:'',w?w.rate:'',w?tot(i)-w.total:'']})]),'text/csv');break}
   case 'signIn':case 'signUp':{const em=($('#acc_email').value||'').trim(),pw=$('#acc_pw').value||'';if(!em||pw.length<6){ui.accMsg='Enter your email and a password of at least 6 characters.';ui.accErr=true;render();break}
     ui.accMsg='Working…';ui.accErr=false;render();
     authCall(act==='signUp'?'up':'in',em,pw).then(r=>{ui.accMsg=r==='confirm'?'Check your email to confirm the account, then sign in.':'Signed in.';ui.accErr=false;render()}).catch(err=>{ui.accMsg=err.message;ui.accErr=true;render()});break}
   case 'signOut':setSess(null);store.plan='free';saveStore();ui.accMsg='';render();break;
   case 'syncNow':ui.accMsg='Syncing…';ui.accErr=false;render();pullWorkspace().then(()=>{ui.accMsg='Synced.';render()}).catch(err=>{ui.accMsg=err.message;ui.accErr=true;render()});break;
   case 'refreshPlan':afterLogin().then(()=>{ui.accMsg='Plan: '+store.plan;ui.accErr=false;render()}).catch(err=>{ui.accMsg=err.message;ui.accErr=true;render()});break;
   case 'subscribe':{ui.accMsg='Opening checkout…';ui.accErr=false;render();
     sbFetch('/functions/v1/payfast-checkout',{method:'POST',body:JSON.stringify({plan:arg})}).then(j=>{
       const f=document.createElement('form');f.method='POST';f.action=j.action;
       j.order.forEach(k=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=j.fields[k];f.appendChild(i)});
       const sg=document.createElement('input');sg.type='hidden';sg.name='signature';sg.value=j.signature;f.appendChild(sg);
       document.body.appendChild(f);f.submit()}).catch(err=>{ui.accMsg=err.message;ui.accErr=true;render()});break}
   case 'backupCopy':copyText(JSON.stringify(store),'Backup copied');break;
   case 'backupSave':saveText('boq-planner-backup.json',JSON.stringify(store,null,1),'application/json');break;
   case 'restore':{try{const s=JSON.parse($('#restorebox').value);if(!s.projects||!s.projects.length)throw 0;store=s;saveStore();ui.view='app';toast('Backup restored');render()}catch(err){toast('That is not a valid backup')}break}
  }
});

document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('.drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('.drop');if(!d)return;e.preventDefault();d.classList.remove('over');const f=e.dataTransfer&&e.dataTransfer.files[0];if(f){if(d.querySelector('#pricefile'))handlePriceFile(f);else handleBOQFile(f)}});
window.addEventListener('error',e=>{ui.impBusy='';ui.impMsg='Something went wrong: '+(e.message||'unknown error');try{render()}catch(x){}});
window.addEventListener('unhandledrejection',e=>{ui.impBusy='';ui.impMsg='Something went wrong: '+((e.reason&&e.reason.message)||'the file could not be read');try{render()}catch(x){}});
